<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Points</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2433;--muted:#6b7385;--accent:#5b5bf0;--line:#e3e6ef}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1c1f2b;--text:#eef0f6;--muted:#98a0b5;--accent:#8c8cff;--line:#2b2f3f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{margin:0 0 4px;font-size:1.7rem}
.sub{color:var(--muted);margin:0 0 20px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rank{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.name{flex:1;font-size:1.15rem;font-weight:600}
.pts{font-size:1.5rem;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>⭐ Class Points</h1>
  <p class="sub">Who’s leading the class?</p>
  <div id="app"></div>
</main>
<script>
// ✏️ EDIT THE POINTS HERE, then save/commit the file on GitHub
const points = {
  Rita: 0,
  Andy: 0,
  Sinay: 0,
  Nahom: 0
};

const app = document.getElementById("app");
Object.keys(points)
  .sort((a, b) => points[b] - points[a] || a.localeCompare(b))
  .forEach((name, i) => {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = '<div class="rank"></div><div class="name"></div><div class="pts"></div>';
    row.children[0].textContent = i + 1;
    row.children[1].textContent = name;
    row.children[2].textContent = points[name];
    app.appendChild(row);
  });
</script>
</body>
</html>
