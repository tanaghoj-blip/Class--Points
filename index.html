<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Points</title>
<style>
:root{--red:#8b1a2b;--gold:#d4a017;--blue:#1f3a8a;--cream:#fff8e7;--ink:#2a1a14}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Georgia,"Times New Roman",serif;background:var(--cream) repeating-linear-gradient(45deg,transparent 0 18px,rgba(212,160,23,.08) 18px 20px);min-height:100vh}
header{background:linear-gradient(135deg,var(--red),#5e0f1c);color:#fff;text-align:center;padding:28px 16px 22px;border-bottom:6px solid var(--gold)}
header svg{width:48px;height:48px;margin-bottom:6px}
h1{margin:0;font-size:1.8rem;letter-spacing:.5px}
header p{margin:6px 0 0;color:#f3dfa2;font-style:italic}
main{max-width:560px;margin:0 auto;padding:22px 16px 48px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:2px solid var(--gold);border-left:8px solid var(--blue);border-radius:14px;padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.row:first-child{border-left-color:var(--red);background:linear-gradient(90deg,#fff3c9,#fff)}
.rank{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;border:2px solid var(--gold)}
.row:first-child .rank{background:var(--red)}
.name{flex:1;font-size:1.2rem;font-weight:700;color:var(--blue);min-width:90px}
.pts{font-size:1.6rem;font-weight:800;color:var(--red)}
.ctrl{display:flex;gap:6px;width:100%;justify-content:flex-end}
button{font:inherit;font-weight:700;border:2px solid var(--gold);background:var(--cream);color:var(--ink);border-radius:10px;padding:7px 14px;cursor:pointer}
button.p{color:var(--blue)}button.m{color:var(--red)}
#admin{display:none;background:#fff;border:2px dashed var(--red);border-radius:14px;padding:14px;margin-bottom:18px}
#admin input{font:inherit;padding:8px;border:2px solid var(--gold);border-radius:8px;width:100%;margin:6px 0}
#msg{text-align:center;color:var(--red);min-height:1.3em;font-style:italic}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#d4a017"><rect x="40" y="6" width="20" height="88" rx="3"/><rect x="6" y="40" width="88" height="20" rx="3"/></g><g fill="#8b1a2b"><circle cx="50" cy="50" r="9"/></g></svg>
  <h1>Class Points</h1>
  <p>Well done, keep shining your light ✨</p>
</header>
<main>
  <div id="admin">
    <strong>Admin</strong>
    <div id="login">
      <input id="token" type="password" placeholder="Paste your GitHub token (saved on this device only)">
      <button id="saveTok">Unlock</button>
    </div>
    <div id="addBox" style="display:none">
      <input id="newName" placeholder="Add a new student name">
      <button id="addBtn">Add student</button>
      <button id="logout" class="m">Lock</button>
    </div>
  </div>
  <p id="msg"></p>
  <div id="app"></div>
</main>
<script>
// ✏️ CHANGE THESE THREE to match your GitHub repo
const OWNER = "YOUR-GITHUB-USERNAME";
const REPO  = "YOUR-REPO-NAME";
const BRANCH = "main";

const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/points.json`;
const app = document.getElementById("app"), msg = document.getElementById("msg");
let points = {}, token = localStorage.getItem("ghToken") || "", timer = null;
const isAdmin = location.hash === "#admin";

function render() {
  app.innerHTML = "";
  Object.keys(points).sort((a, b) => points[b] - points[a] || a.localeCompare(b)).forEach((n, i) => {
    const row = document.createElement("div"); row.className = "row";
    row.innerHTML = '<div class="rank"></div><div class="name"></div><div class="pts"></div>';
    row.children[0].textContent = i + 1;
    row.children[1].textContent = n;
    row.children[2].textContent = points[n];
    if (isAdmin && token) {
      const c = document.createElement("div"); c.className = "ctrl";
      [-1, 1, 5, 10].forEach(d => {
        const b = document.createElement("button");
        b.className = d > 0 ? "p" : "m";
        b.textContent = (d > 0 ? "+" : "−") + Math.abs(d);
        b.onclick = () => { points[n] = (points[n] || 0) + d; render(); queueSave(); };
        c.appendChild(b);
      });
      row.appendChild(c);
    }
    app.appendChild(row);
  });
}

async function load() {
  try {
    if (isAdmin && token) {
      const r = await fetch(API + "?ref=" + BRANCH, { headers: { Authorization: "Bearer " + token } });
      const j = await r.json();
      points = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, "")))));
    } else {
      points = await (await fetch("points.json?t=" + Date.now())).json();
    }
  } catch (e) { msg.textContent = "Could not load points."; }
  render();
}

function queueSave() { msg.textContent = "Saving…"; clearTimeout(timer); timer = setTimeout(save, 1000); }

async function save() {
  try {
    const h = { Authorization: "Bearer " + token };
    const cur = await (await fetch(API + "?ref=" + BRANCH, { headers: h })).json();
    const body = { message: "Update points", branch: BRANCH, sha: cur.sha,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(points)))) };
    const r = await fetch(API, { method: "PUT", headers: h, body: JSON.stringify(body) });
    msg.textContent = r.ok ? "Saved ✓ (everyone sees it in about a minute)" : "Save failed, check your token.";
  } catch (e) { msg.textContent = "Save failed."; }
}

if (isAdmin) {
  document.getElementById("admin").style.display = "block";
  const sync = () => {
    document.getElementById("login").style.display = token ? "none" : "block";
    document.getElementById("addBox").style.display = token ? "block" : "none";
  };
  sync();
  document.getElementById("saveTok").onclick = () => {
    token = document.getElementById("token").value.trim();
    localStorage.setItem("ghToken", token); sync(); load();
  };
  document.getElementById("logout").onclick = () => { localStorage.removeItem("ghToken"); token = ""; sync(); load(); };
  document.getElementById("addBtn").onclick = () => {
    const n = document.getElementById("newName").value.trim();
    if (n && !(n in points)) { points[n] = 0; document.getElementById("newName").value = ""; render(); queueSave(); }
  };
}
load();
</script>
</body>
</html>
